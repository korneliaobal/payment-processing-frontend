<aside class="summary panel">
  <div class="eyebrow">{{ heading() }}</div>
  <div class="total">
    {{ amount() | number: '1.2-2' }} <span>{{ currency() }}</span>
  </div>
  <div class="summary-row">
    <span>Liczba transakcji</span><strong>{{ transactionCount() }}</strong>
  </div>
  @if (showPaymentType()) {
    <div class="summary-row"><span>Rodzaj zlecenia</span><strong>Płatność zbiorcza</strong></div>
  }
  <div class="summary-divider"></div>
  <div class="info-note">
    <span>ⓘ</span>
    <p>{{ description() }}</p>
  </div>
  <button class="primary" [type]="actionType()" (click)="action.emit()" [disabled]="busy()">
    {{ busy() ? 'Wysyłanie zlecenia…' : actionLabel() }} <span>→</span>
  </button>
  @if (footnote()) {
    <small class="summary-footnote">{{ footnote() }}</small>
  }
</aside>
